features:
- name: Programmatic Database Provisioning
  description: Database APIs let teams create, configure, resize, and tear down database
    instances on demand without filing tickets or running infrastructure scripts,
    making databases first-class deployable resources.
- name: Branching and Forking
  description: Modern serverless database platforms like Neon, PlanetScale, and Supabase
    expose branching APIs that let developers create isolated copies of a production
    database for development, testing, and pull request previews.
- name: HTTP and SQL-over-HTTP Query Interfaces
  description: Databases like Neon, Supabase, PlanetScale, and Cloudflare D1 expose
    SQL execution through HTTPS endpoints, enabling stateless query access from serverless
    functions and edge runtimes without persistent TCP connections.
- name: Vector Search and Embeddings
  description: Vector databases like Pinecone, Weaviate, Qdrant, and Milvus expose
    APIs for storing high-dimensional embeddings and running nearest-neighbor similarity
    search, powering retrieval-augmented generation and semantic search.
- name: Schema Migration and Versioning
  description: Database platforms provide APIs for managing schema migrations, deploy
    requests, and zero-downtime schema changes, integrating database evolution into
    CI/CD pipelines.
- name: Analytical Query and Warehouse APIs
  description: Cloud data warehouses like Snowflake, BigQuery, Redshift, Databricks,
    and ClickHouse expose REST and SQL APIs for executing analytical queries, managing
    warehouses, and orchestrating data pipelines at petabyte scale.
- name: Multi-Region Replication and Edge Reads
  description: Distributed and serverless databases expose APIs for configuring read
    replicas, regional failover, and edge-local reads, reducing latency for globally
    distributed applications.
- name: Backups, Snapshots, and Point-in-Time Recovery
  description: Managed database APIs provide programmatic control over backups, snapshots,
    restore points, and point-in-time recovery, treating data protection as code rather
    than a manual operations process.
use_cases:
- name: Serverless Application Backends
  description: Developers use serverless database APIs from Neon, Supabase, Fauna,
    Convex, and Cloudflare D1 to back serverless functions and edge applications without
    managing connection pools or persistent infrastructure.
- name: Database-per-Tenant Provisioning
  description: SaaS platforms use database provisioning APIs to spin up isolated database
    instances or branches per customer, providing strong tenant isolation and per-tenant
    backup, recovery, and scaling.
- name: Retrieval-Augmented Generation (RAG)
  description: AI applications use vector database APIs from Pinecone, Weaviate, Qdrant,
    Milvus, and pgvector-backed services to index document embeddings and retrieve
    semantically relevant context for LLM prompts.
- name: Real-Time Analytics and Observability
  description: Time-series and columnar APIs from ClickHouse, InfluxDB, TimescaleDB,
    QuestDB, and Tinybird power real-time dashboards, observability platforms, and
    user-facing analytics on high-volume event streams.
- name: Data Warehouse Integration and ELT
  description: Analytics and data teams use APIs from Snowflake, BigQuery, Redshift,
    and Databricks to load data, run transformations, manage warehouses, and integrate
    with dbt, Fivetran, and orchestration tooling.
- name: Schema Migrations in CI/CD
  description: Teams use deploy-request and migration APIs from PlanetScale, Neon,
    and Supabase to gate schema changes through pull requests, run them in branches,
    and apply them safely to production.
- name: Graph Workloads and Knowledge Graphs
  description: Applications use graph database APIs from Neo4j, Stardog, and Amazon
    Neptune to model relationships, run path and traversal queries, and back knowledge
    graphs and recommendation engines.
- name: Edge and Mobile Data Sync
  description: Edge databases like Cloudflare D1, Convex, and Supabase expose APIs
    that synchronize state between edge runtimes, mobile clients, and central data
    stores with built-in conflict resolution.
integrations:
- name: Neon
  description: Serverless PostgreSQL platform with branching, scale-to-zero compute,
    and an HTTP query endpoint designed for serverless and edge runtimes.
- name: Supabase
  description: Open-source PostgreSQL platform with auto-generated REST and GraphQL
    APIs, realtime subscriptions, auth, storage, and edge functions.
- name: PlanetScale
  description: Serverless MySQL platform built on Vitess with non-blocking schema
    changes, deploy requests, and branching for safe production database evolution.
- name: MongoDB Atlas
  description: Managed multi-cloud document database with Atlas Data API, Atlas Search,
    Atlas Vector Search, and a fully managed control plane API.
- name: Snowflake
  description: Cloud data warehouse with SQL API, REST control plane, and Snowpipe
    for streaming data ingestion across AWS, Azure, and GCP.
- name: Pinecone
  description: Managed vector database with REST and gRPC APIs for storing embeddings
    and running low-latency similarity search at scale.
- name: Databricks
  description: Lakehouse platform with REST APIs for SQL warehouses, jobs, Unity Catalog,
    model serving, and Delta Lake table management.
- name: Fauna
  description: Distributed document-relational serverless database with a unified
    HTTP API, FQL query language, and ACID transactions across regions.
